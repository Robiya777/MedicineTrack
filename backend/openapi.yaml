        name:
          type: string
          maxLength: 200
        parent:
          type: string
          format: uuid
          nullable: true
      required:
      - id
      - name
    TerritoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        parent:
          type: string
          format: uuid
          nullable: true
      required:
      - name
    TokenOutput:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
        user:
          $ref: '#/components/schemas/User'
      required:
      - access
      - user
    TypeEnum:
      enum:
      - HOSPITAL
      - CLINIC
      type: string
      description: |-
        * `HOSPITAL` - Statsionar
        * `CLINIC` - Poliklinika
    UploadInputRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
      required:
      - file
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/UserRoleEnum'
          readOnly: true
        organization:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        patient:
          type: string
          format: uuid
          readOnly: true
          nullable: true
      required:
      - first_name
      - id
      - last_name
      - organization
      - patient
      - role
      - username
    UserRoleEnum:
      enum:
      - HOSPITAL
      - DOCTOR
      - COORDINATOR
      - ADMIN
      - PATIENT
      type: string
      description: |-
        * `HOSPITAL` - Statsionar xodimi
        * `DOCTOR` - Oilaviy shifokor
        * `COORDINATOR` - Koordinator
        * `ADMIN` - Texnik admin
        * `PATIENT` - Bemor
    VersionInputRequest:
      type: object
      properties:
        version:
          type: integer
          minimum: 1
      required:
      - version
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
