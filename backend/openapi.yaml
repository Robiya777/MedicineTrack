components:
  schemas:
    AIReviewInputRequest:
      type: object
      properties:
        summary:
          type: string
          nullable: true
        diagnosis_text:
          type: string
          nullable: true
        recommendations:
          type: array
          items:
            type: string
            minLength: 1
        follow_up_text:
          type: string
          nullable: true
      required:
      - diagnosis_text
      - follow_up_text
      - recommendations
      - summary
    ActivationInputRequest:
      type: object
      properties:
        patient_id:
          type: string
          format: uuid
        code:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - code
      - password
      - patient_id
    ActivationIssueInputRequest:
      type: object
      properties:
        phone_verified:
          type: boolean
      required:
      - phone_verified
    ActivationOutput:
      type: object
      properties:
        patient_id:
          type: string
          format: uuid
        code:
          type: string
        expires_at:
          type: string
          format: date-time
      required:
      - code
      - expires_at
      - patient_id
    Attachment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        discharge:
          type: string
          format: uuid
          readOnly: true
        checksum:
          type: string
          readOnly: true
        mime:
          type: string
          readOnly: true
        size:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        download_url:
          type: string
          readOnly: true
      required:
      - checksum
      - created_at
      - discharge
      - download_url
      - id
      - mime
      - size
    CancelInputRequest:
      type: object
      properties:
        version:
          type: integer
          minimum: 1
        reason_code:
          type: string
          minLength: 1
          maxLength: 64
        reason:
          type: string
          minLength: 1
      required:
      - reason
      - reason_code
      - version
    ClientEnum:
      enum:
      - web
      - android
      type: string
      description: |-
        * `web` - web
        * `android` - android
    CompleteInputRequest:
      type: object
      properties:
        version:
          type: integer
          minimum: 1
        performed_at:
          type: string
          format: date-time
        channel:
          $ref: '#/components/schemas/ContactChannelEnum'
        observation:
          type: string
          minLength: 1
        actions:
          type: string
          minLength: 1
        follow_up:
          type: string
          minLength: 1
      required:
      - actions
      - channel
      - follow_up
      - observation
      - performed_at
      - version
    ContactAttempt:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        channel:
          $ref: '#/components/schemas/ContactChannelEnum'
        result:
          $ref: '#/components/schemas/ResultEnum'
        attempted_at:
          type: string
          format: date-time
        note:
          type: string
        next_action:
          type: string
        actor:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - actor
      - attempted_at
      - channel
      - created_at
      - id
      - next_action
      - note
      - result
    ContactAttemptInputRequest:
      type: object
      properties:
        channel:
          $ref: '#/components/schemas/ContactChannelEnum'
        result:
          $ref: '#/components/schemas/ResultEnum'
        attempted_at:
          type: string
          format: date-time
        note:
          type: string
          minLength: 1
        next_action:
          type: string
          minLength: 1
        version:
          type: integer
          minimum: 1
          writeOnly: true
      required:
      - attempted_at
      - channel
      - next_action
      - note
      - result
      - version
    ContactChannelEnum:
      enum:
      - PHONE
      - HOME_VISIT
      type: string
      description: |-
        * `PHONE` - Telefon
        * `HOME_VISIT` - Uyga tashrif
    Conversation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        patient:
          type: string
          format: uuid
          readOnly: true
        doctor:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/ConversationStatusEnum'
          readOnly: true
        response_due_at:
          type: string
          nullable: true
          readOnly: true
        first_unanswered_at:
          type: string
          nullable: true
          readOnly: true
        work_schedule:
          type: object
          additionalProperties: {}
          readOnly: true
        response_policy:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - doctor
      - first_unanswered_at
      - id
      - patient
      - response_due_at
      - response_policy
      - status
      - work_schedule
    ConversationStatusEnum:
      enum:
      - OPEN
      - CLOSED
      type: string
      description: |-
        * `OPEN` - OPEN
        * `CLOSED` - CLOSED
    Correction:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        field:
          type: string
          maxLength: 32
        correction_text:
          type: string
        reason:
          type: string
        actor:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - actor
      - correction_text
      - created_at
      - field
      - id
      - reason
    CorrectionRequest:
      type: object
      properties:
        field:
          type: string
          minLength: 1
          maxLength: 32
        correction_text:
          type: string
          minLength: 1
        reason:
          type: string
          minLength: 1
      required:
      - correction_text
      - field
      - reason
